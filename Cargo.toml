[package]
name = "velocity-breaker"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["wav"] }
leafwing-input-manager = "0.22"
bevy_ecs_ldtk = "0.16"
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
